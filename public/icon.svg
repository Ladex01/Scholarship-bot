<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D9BF0" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F52BA" />
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#002266" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Base with Twitter / Electric Blue Palette -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle refined inner ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.22" />

  <!-- Dedicated Crisp White DiplomatScholar Emblem -->
  <g filter="url(#softShadow)">
    <!-- Soaring Graduate Mortarboard Diamond -->
    <path d="M256 120 L400 196 L256 272 L112 196 Z" fill="url(#emblemGrad)" />
    
    <!-- Diplomatic Accord / Career Ascent Wings Chevron -->
    <path d="M152 232 L256 288 L360 232 V278 L256 334 L152 278 Z" fill="url(#emblemGrad)" fill-opacity="0.96" />

    <!-- Forward Placement / NYSC Lagos Trajectory Arrow Crest -->
    <path d="M200 324 L256 354 L312 324 V362 L256 392 L200 362 Z" fill="url(#emblemGrad)" fill-opacity="0.90" />

    <!-- Pure White Academic Tassel & Pendant -->
    <path d="M380 206 L380 306" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <circle cx="380" cy="318" r="14" fill="#FFFFFF" />

    <!-- Center Diplomatic Star Node -->
    <circle cx="256" cy="196" r="10" fill="#1D9BF0" />
  </g>
</svg>